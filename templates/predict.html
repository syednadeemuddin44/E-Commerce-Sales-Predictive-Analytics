<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predict Sales & Profit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <h2>Sales & Profit Prediction</h2>

    <!-- RESULT BLOCK -->
    {% if predicted_sales is not none %}
        <div class="result">
            <h3>Predicted Sales: ${{ predicted_sales }}</h3>
            <h3>{{ profit_prediction }}</h3>
        </div>
    {% endif %}

    <!-- FORM -->
    <div class="dashboard-container">
        <form method="POST" action="{{ url_for('predict') }}">
            
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" name="category_name" required>
            </div>

            <div class="form-group">
                <label>Customer Region</label>
                <input type="text" name="customer_region" required>
            </div>

            <div class="form-group">
                <label>Shipping Type</label>
                <input type="text" name="shipping_type" required>
            </div>

            <div class="form-group">
                <label>Order Quantity</label>
                <input type="number" name="order_quantity" required>
            </div>

            <div class="form-group">
                <label>Days for Shipment Scheduled</label>
                <input type="number" name="days_for_shipment_scheduled" required>
            </div>

            <input type="submit" value="Predict">
        </form>
    </div>

    <!-- CHART BUTTON -->
    <a href="{{ url_for('chart') }}"
       style="padding:10px 20px;background:red;color:white;
              text-decoration:none;border-radius:8px;
              display:block;text-align:center;margin-top:30px;">
        Visualization
    </a>

</body>
</html>
